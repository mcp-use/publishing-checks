name: Manufact Publishing Checks
description: Run the Manufact publishing checklist for an MCP server and fail the job when checks fail.
author: manufact
branding:
  icon: bell
  color: black

inputs:
  api-key:
    description: Manufact API key. Store it as a repository secret.
    required: true
  server:
    description: Server ID, the UUID in the server's dashboard URL (manufact.com/cloud/<org>/servers/<server-id>/...).
    required: true
  branch:
    description: Preview branch whose deployment is checked. Defaults to the pull request head branch, and to production on other events. Set it to an empty string to always check production. Ignored when url or profile is set.
    required: false
    default: ${{ github.head_ref }}
  url:
    description: External URL servers only. The MCP URL to check instead of the server's, such as a preview deployment. When set, branch is ignored.
    required: false
    default: ""
  profile:
    description: External URL servers only. The ID of the profile to authenticate with instead of the server's. When set, branch is ignored.
    required: false
    default: ""
  fail-on:
    description: "When to fail the job: none, failed or warnings."
    required: false
    default: failed
  comment:
    description: "On pull requests, comment that checks are running, then replace it with the full report. Later runs update the same comment. Needs `pull-requests: write`."
    required: false
    default: "true"
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}

outputs:
  run-id:
    description: Checklist run ID.
    value: ${{ steps.checklist.outputs.run-id }}
  status:
    description: Final run status, for example completed or failed.
    value: ${{ steps.checklist.outputs.status }}
  ready-for-chatgpt:
    description: Whether the server is ready for ChatGPT (true, false, or empty when unknown).
    value: ${{ steps.checklist.outputs.ready-for-chatgpt }}
  ready-for-claude:
    description: Whether the server is ready for Claude (true, false, or empty when unknown).
    value: ${{ steps.checklist.outputs.ready-for-claude }}
  score:
    description: Checks score out of 100, as shown on the dashboard.
    value: ${{ steps.checklist.outputs.score }}
  dashboard-url:
    description: Link to the checklist in the Manufact dashboard.
    value: ${{ steps.checklist.outputs.dashboard-url }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Run publishing checklist
      id: checklist
      shell: bash
      env:
        MANUFACT_TOKEN: ${{ inputs.api-key }}
        MANUFACT_SERVER: ${{ inputs.server }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        # Each release of this action pins the CLI it was tested with.
        CLI_PACKAGE: "@mcp-use/cli@5.3.0"
        NO_COLOR: "1"
      run: |
        # GitHub runs bash with -e; turn it off so a failing CLI still reports.
        set +e -uo pipefail
        cli=(npx --yes "$CLI_PACKAGE")
        result="$RUNNER_TEMP/mcp-use-checklist.json"
        errors="$RUNNER_TEMP/mcp-use-checklist.err"
        markdown="$RUNNER_TEMP/mcp-use-checklist.md"
        rm -f "$result" "$markdown.body"
        marker="<!-- manufact-publishing-checks:$MANUFACT_SERVER -->"

        # Name the commit that was checked: the deployment's, else the pull request head's, else the workflow's.
        commit=$(jq -r '.deployment.sha // .pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
        commit="${commit:-$GITHUB_SHA}"
        commit_line="Commit: \`${commit:0:7}\`"

        # Find the pull request to comment on.
        pr=""
        if [ "$INPUT_COMMENT" = "true" ]; then
          pr=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
          # After a deployment there is no pull request in the event: find the open one for its commit.
          if [ -z "$pr" ] && [ "$GITHUB_EVENT_NAME" = "deployment_status" ]; then
            sha=$(jq -r '.deployment.sha // empty' "$GITHUB_EVENT_PATH")
            if [ -n "$sha" ]; then
              pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '[.[] | select(.state == "open")][0].number // empty' 2>/dev/null)
            fi
          fi
        fi

        # Post or update one comment per server on the pull request. Failures only warn.
        comments="repos/$GITHUB_REPOSITORY/issues"
        comment_id=""
        comment_warned=""
        comment_on_pr() {
          local body=$1 id
          [ -n "$pr" ] || return 0
          if [ -z "$comment_id" ]; then
            comment_id=$(gh api --paginate "$comments/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -n 1)
          fi
          # Update our earlier comment; post a new one if there's none, or if the
          # marked comment isn't ours to edit.
          if [ -n "$comment_id" ] && gh api -X PATCH "$comments/comments/$comment_id" -F body=@"$body" > /dev/null; then
            return 0
          fi
          if id=$(gh api -X POST "$comments/$pr/comments" -F body=@"$body" --jq '.id') && [ -n "$id" ]; then
            comment_id=$id
            return 0
          fi
          if [ -z "$comment_warned" ]; then
            echo "::warning title=Publishing checklist::Couldn't comment on the pull request. Grant the job 'pull-requests: write', or set comment: false."
            comment_warned=1
          fi
        }

        # Show that checks are running until the report replaces it.
        if [ -n "$pr" ]; then
          {
            echo "$marker"
            echo "## Publishing checks"
            echo
            echo "$commit_line"
            echo
            echo "⏳ Publishing checks running. [View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$markdown.running"
          comment_on_pr "$markdown.running"
        fi

        args=(checklist run --fail-on "$INPUT_FAIL_ON" --verbose --json-file "$result" --markdown-file "$markdown.body")
        # External URL servers have no branches: url and profile replace branch.
        if [ -n "$INPUT_URL" ] || [ -n "$INPUT_PROFILE" ]; then
          if [ -n "$INPUT_URL" ]; then args+=(--url "$INPUT_URL"); fi
          if [ -n "$INPUT_PROFILE" ]; then args+=(--profile "$INPUT_PROFILE"); fi
        elif [ -n "$INPUT_BRANCH" ]; then
          args+=(--branch "$INPUT_BRANCH")
        fi

        # The readable report goes to the log; JSON and Markdown go to files.
        "${cli[@]}" "${args[@]}" 2> "$errors"
        code=$?
        cat "$errors" >&2

        run_id=$(jq -r '.id // empty' "$result" 2>/dev/null || true)

        if [ -z "$run_id" ]; then
          # No result (bad API key, unknown server, usage error...): use the CLI's error line.
          message=$(grep -v -e '^Running checklist$' -e '^$' "$errors" | head -n 1)
          message="${message:-mcp-use checklist run exited with code $code}"
          echo "::error title=Publishing checklist::$message"
          {
            echo "$marker"
            echo "## ❌ Publishing checklist couldn't run"
            echo
            echo "Server \`$MANUFACT_SERVER\`"
            echo
            echo '```text'
            grep -v '^Running checklist$' "$errors"
            echo '```'
          } > "$markdown"
          [ "$code" -eq 0 ] && code=1
        else
          {
            echo "run-id=$run_id"
            echo "status=$(jq -r '.status' "$result")"
            echo "score=$(jq -r '.score // empty' "$result")"
            echo "ready-for-chatgpt=$(jq -r '.isReadyForChatgpt | if . == null then empty else . end' "$result")"
            echo "ready-for-claude=$(jq -r '.isReadyForClaudeai | if . == null then empty else . end' "$result")"
            echo "dashboard-url=$(jq -r '.dashboardUrl // empty' "$result")"
          } >> "$GITHUB_OUTPUT"

          # The CLI renders the report like the dashboard; add our comment marker
          # and the commit, under the heading (or at the end if there's none).
          { echo "$marker"; awk -v line="$commit_line" '
              { print }
              /^## Publishing checks/ && !done { print ""; print line; done = 1 }
              END { if (!done) { print ""; print line } }
            ' "$markdown.body"; } > "$markdown"
          if [ "$code" -ne 0 ]; then
            echo "::error title=Publishing checklist::Checklist did not pass (fail-on: $INPUT_FAIL_ON). See the report above."
          fi
        fi

        tail -n +2 "$markdown" >> "$GITHUB_STEP_SUMMARY"
        comment_on_pr "$markdown"

        exit $code
