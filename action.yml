name: Manufact publishing checks
description: Run the Manufact Cloud publishing checklist for an MCP server and fail the job when checks fail.
author: manufact
branding:
  icon: check-circle
  color: green

inputs:
  token:
    description: Manufact Cloud API key. Store it as a repository secret.
    required: true
  server:
    description: Server ID or slug. Defaults to the project link in `path`, if one is committed.
    required: false
  org:
    description: Organization ID or slug. Only needed when the key can reach several organizations.
    required: false
  branch:
    description: Preview branch whose deployment is checked. Defaults to the pull request head branch, and to production on other events. Set it to an empty string to always check production.
    required: false
    default: ${{ github.head_ref }}
  fail-on:
    description: "When to fail the job: none, failed or warnings."
    required: false
    default: failed
  path:
    description: Project directory, used to find a committed project link.
    required: false
    default: .
  comment:
    description: "On pull requests, post the full report as a comment and update it on later runs. Needs `pull-requests: write`."
    required: false
    default: "true"
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}

outputs:
  run-id:
    description: Checklist run ID.
    value: ${{ steps.checklist.outputs.run-id }}
  status:
    description: Final run status, for example completed or failed.
    value: ${{ steps.checklist.outputs.status }}
  ready-for-chatgpt:
    description: Whether the server is ready for ChatGPT (true, false, or empty when unknown).
    value: ${{ steps.checklist.outputs.ready-for-chatgpt }}
  ready-for-claude:
    description: Whether the server is ready for Claude (true, false, or empty when unknown).
    value: ${{ steps.checklist.outputs.ready-for-claude }}
  score:
    description: Checks score out of 100, as shown on the dashboard.
    value: ${{ steps.checklist.outputs.score }}
  dashboard-url:
    description: Link to the checklist in the Manufact dashboard.
    value: ${{ steps.checklist.outputs.dashboard-url }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run publishing checklist
      id: checklist
      shell: bash
      env:
        MANUFACT_TOKEN: ${{ inputs.token }}
        MANUFACT_SERVER: ${{ inputs.server }}
        MANUFACT_ORG: ${{ inputs.org }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        # Each release of this action pins the CLI it was tested with.
        # TODO before v1: replace the PR preview with "@mcp-use/cli@5.2.0".
        CLI_PACKAGE: "https://pkg.pr.new/mcp-use/mcp-use/@mcp-use/cli@3113"
        NO_COLOR: "1"
      run: |
        # GitHub runs bash with -e; turn it off so a failing CLI still reports.
        set +e -uo pipefail
        cli=(npx --yes "$CLI_PACKAGE")
        result="$RUNNER_TEMP/mcp-use-checklist.json"
        errors="$RUNNER_TEMP/mcp-use-checklist.err"
        markdown="$RUNNER_TEMP/mcp-use-checklist.md"
        rm -f "$result" "$markdown.body"
        args=(checklist run --path "$INPUT_PATH" --fail-on "$INPUT_FAIL_ON" --verbose --json-file "$result" --markdown-file "$markdown.body")
        if [ -n "$INPUT_BRANCH" ]; then args+=(--branch "$INPUT_BRANCH"); fi

        # The readable report goes to the log; JSON and Markdown go to files.
        "${cli[@]}" "${args[@]}" 2> "$errors"
        code=$?
        cat "$errors" >&2

        run_id=$(jq -r '.id // empty' "$result" 2>/dev/null || true)
        server_label="${MANUFACT_SERVER:-linked server}"
        marker="<!-- manufact-publishing-checks:${MANUFACT_SERVER:-default} -->"

        if [ -z "$run_id" ]; then
          # No result (bad token, unknown server, usage error...): use the CLI's error line.
          message=$(grep -v -e '^Running checklist$' -e '^$' "$errors" | head -n 1)
          message="${message:-mcp-use checklist run exited with code $code}"
          echo "::error title=Publishing checklist::$message"
          {
            echo "$marker"
            echo "## ❌ Publishing checklist couldn't run"
            echo
            echo "Server \`$server_label\`"
            echo
            echo '```text'
            grep -v '^Running checklist$' "$errors"
            echo '```'
          } > "$markdown"
          [ "$code" -eq 0 ] && code=1
        else
          {
            echo "run-id=$run_id"
            echo "status=$(jq -r '.status' "$result")"
            echo "score=$(jq -r '.score // empty' "$result")"
            echo "ready-for-chatgpt=$(jq -r '.isReadyForChatgpt | if . == null then empty else . end' "$result")"
            echo "ready-for-claude=$(jq -r '.isReadyForClaudeai | if . == null then empty else . end' "$result")"
            echo "dashboard-url=$(jq -r '.dashboardUrl // empty' "$result")"
          } >> "$GITHUB_OUTPUT"

          # The CLI renders the report like the dashboard; add our comment marker.
          { echo "$marker"; cat "$markdown.body"; } > "$markdown"
          if [ "$code" -ne 0 ]; then
            echo "::error title=Publishing checklist::Checklist did not pass (fail-on: $INPUT_FAIL_ON). See the report above."
          fi
        fi

        tail -n +2 "$markdown" >> "$GITHUB_STEP_SUMMARY"

        # Post or update one comment per server on the pull request.
        pr=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
        if [ "$INPUT_COMMENT" = "true" ] && [ -n "$pr" ]; then
          comments="repos/$GITHUB_REPOSITORY/issues"
          existing=$(gh api --paginate "$comments/$pr/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -n 1)
          # Update our earlier comment; post a new one if there's none, or if the
          # marked comment isn't ours to edit.
          if ! { [ -n "$existing" ] && gh api -X PATCH "$comments/comments/$existing" -F body=@"$markdown" > /dev/null; } &&
             ! gh api -X POST "$comments/$pr/comments" -F body=@"$markdown" > /dev/null; then
            echo "::warning title=Publishing checklist::Couldn't comment on the pull request. Grant the job 'pull-requests: write', or set comment: false."
          fi
        fi

        exit $code
